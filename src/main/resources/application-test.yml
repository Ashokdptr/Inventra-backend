spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  h2:
    console:
      enabled: false

jwt:
  secret: inventra-super-secret-key-minimum-256-bits-long-for-hmac-sha-do-not-use-in-prod
  expiration: 86400000
  refresh-expiration: 604800000
